<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面歌词</title>
    <link rel="stylesheet" href="styles/DesktopLyrics.scss">
</head>
<body>
    <div id="desktop-lyrics" class="desktop-lyrics-container">
        <!-- 歌词显示区域 -->
        <div class="lyrics-content">
            <!-- 当前歌词行 -->
            <div class="current-lyric">
                <span class="lyric-text" data-line="current"></span>
            </div>
            <!-- 下一句歌词行 -->
            <div class="next-lyric">
                <span class="lyric-text" data-line="next"></span>
            </div>
        </div>

        <!-- 控制栏(鼠标悬停时显示) -->
        <div class="controls-bar">
            <div class="control-button" id="lock-btn" title="锁定">
                <!-- 锁定图标 -->
                <svg class="icon lock-icon" viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM9 8V6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9z"/>
                </svg>
                <!-- 解锁图标 -->
                <svg class="icon unlock-icon" viewBox="0 0 24 24" style="display: none;">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6h2c0-1.66 1.34-3 3-3s3 1.34 3 3v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                </svg>
            </div>
            <div class="control-button" id="close-btn" title="关闭">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </div>
        </div>
    </div>

    <script type="module" src="js/features/desktopLyrics/DesktopLyrics.ts"></script>
</body>
</html>
