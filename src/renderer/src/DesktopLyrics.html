<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>桌面歌词</title>
    <link rel="stylesheet" href="styles/DesktopLyrics.scss">
</head>
<body>
    <div class="desktop-lyrics" id="desktopLyrics">
        <!-- 歌词容器 -->
        <div class="lyrics-wrapper" id="lyricsWrapper">
            <!-- 前一句歌词 -->
            <div class="lyric-line prev" id="prevLyric"></div>

            <!-- 当前歌词 -->
            <div class="lyric-line current" id="currentLyric">
                <span class="lyric-text">等待播放...</span>
            </div>

            <!-- 下一句歌词 -->
            <div class="lyric-line next" id="nextLyric"></div>
        </div>

        <!-- 控制栏 -->
        <div class="controls-bar" id="controlsBar">
            <div class="control-icon" id="lockBtn" title="锁定位置">🔒</div>
            <div class="control-icon" id="closeBtn" title="关闭">✕</div>
        </div>
    </div>

    <script type="module" src="js/pages/DesktopLyrics.js"></script>
</body>
</html>
